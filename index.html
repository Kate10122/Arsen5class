<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚽ Футбольные уравнения — 5 класс</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --grass:#4a9a3a;
    --grass-dark:#2a7a1a;
    --sky:#87CEEB;
    --sky-light:#B0E0FF;
    --gold:#f4c430;
    --gold-dark:#b8860b;
    --white:#fff;
    --ink:#1a2a3a;
    --ink-soft:#4a5a6a;
    --green:#3a9a5a;
    --red:#e86060;
  }
  body{
    font-family:'Segoe UI','Roboto',system-ui,sans-serif;
    background:
      radial-gradient(circle at 20% 20%,rgba(74,154,58,.10),transparent 40%),
      radial-gradient(circle at 80% 80%,rgba(244,196,48,.10),transparent 40%),
      linear-gradient(160deg,#1a2a3a 0%,#2a4a6a 100%);
    min-height:100vh;
    padding:18px 14px;
    color:var(--ink);
  }

  .app{max-width:900px;margin:0 auto}

  /* ============ СЧЁТ ============ */
  .scoreboard{
    background:linear-gradient(135deg,#1a1a2a,#2a2a3a);
    border:3px solid var(--gold);
    border-radius:20px;
    padding:14px 22px;
    margin-bottom:16px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:14px;
    flex-wrap:wrap;
    box-shadow:0 0 30px rgba(244,196,48,.35),inset 0 0 20px rgba(0,0,0,.4);
    position:relative;
    overflow:hidden;
  }
  .scoreboard::before{
    content:"";
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(90deg,transparent 0,transparent 30px,rgba(244,196,48,.05) 30px,rgba(244,196,48,.05) 32px);
    pointer-events:none;
  }

  .team{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Georgia',serif;
    font-size:16px;
    font-weight:800;
    color:var(--gold);
    text-shadow:0 0 10px rgba(244,196,48,.6);
  }
  .team .icon{font-size:26px}

  .score{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Courier New',monospace;
    font-size:36px;
    font-weight:900;
    letter-spacing:3px;
  }
  .score .goals{
    color:#7dda85;
    text-shadow:0 0 20px rgba(125,218,133,.8);
    min-width:54px;
    text-align:center;
    background:rgba(0,0,0,.4);
    padding:2px 12px;
    border-radius:10px;
    border:2px solid rgba(125,218,133,.4);
  }
  .score .sep{color:var(--gold);font-size:30px}
  .score .misses{
    color:#ff9a9a;
    text-shadow:0 0 20px rgba(255,154,154,.8);
    min-width:54px;
    text-align:center;
    background:rgba(0,0,0,.4);
    padding:2px 12px;
    border-radius:10px;
    border:2px solid rgba(255,154,154,.4);
  }

  .progress-balls{
    display:flex;
    gap:5px;
    font-size:18px;
  }
  .progress-balls .ball{
    opacity:.25;
    transition:all .4s;
  }
  .progress-balls .ball.done{opacity:1;transform:scale(1.15)}

  /* ============ ИГРОВОЕ ПОЛЕ ============ */
  .field-wrapper{
    position:relative;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 12px 40px rgba(0,0,0,.5),inset 0 0 0 3px rgba(244,196,48,.3);
    margin-bottom:16px;
  }
  .field-wrapper svg{
    display:block;
    width:100%;
    height:auto;
    aspect-ratio:900/500;
  }

  /* ============ ПАНЕЛЬ УРАВНЕНИЯ ============ */
  .task-panel{
    background:linear-gradient(160deg,#ffffff,#f0f6fa);
    border-radius:20px;
    padding:20px 24px 22px;
    box-shadow:0 12px 40px rgba(0,0,0,.4),inset 0 0 0 2px rgba(74,123,168,.3);
    position:relative;
  }

  .task-number{
    position:absolute;
    top:-14px;left:22px;
    background:linear-gradient(135deg,#f4c430,#b8860b);
    color:#1a2a3a;
    font-family:'Segoe UI',sans-serif;
    font-size:13px;
    font-weight:800;
    padding:5px 16px;
    border-radius:20px;
    box-shadow:0 4px 14px rgba(244,196,48,.5);
    letter-spacing:.5px;
  }

  .task-header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    margin-bottom:14px;
    margin-top:6px;
    flex-wrap:wrap;
  }
  .task-label{
    font-family:'Georgia',serif;
    font-size:16px;
    color:var(--ink-soft);
    font-weight:600;
  }
  .task-equation{
    font-family:'Cambria Math','Times New Roman',serif;
    font-size:34px;
    font-weight:800;
    color:#1a3a6a;
    letter-spacing:1px;
    background:linear-gradient(135deg,#e8f0f8,#d0e0f0);
    padding:10px 26px;
    border-radius:16px;
    border:2px solid #a8c8e0;
    box-shadow:0 4px 12px rgba(74,123,168,.15);
  }

  .answer-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    margin-top:8px;
  }
  .answer-row label{
    font-family:'Georgia',serif;
    font-size:20px;
    font-weight:800;
    color:#1a3a6a;
    font-style:italic;
  }
  .answer-row input[type="text"]{
    width:160px;
    padding:12px 20px;
    border:3px solid #a8c8e0;
    border-radius:14px;
    font-size:22px;
    font-family:'Courier New',monospace;
    font-weight:800;
    color:#1a3a6a;
    background:#fff;
    outline:none;
    text-align:center;
    transition:all .3s;
    letter-spacing:1px;
  }
  .answer-row input[type="text"]:focus{
    border-color:var(--gold);
    box-shadow:0 0 0 4px rgba(244,196,48,.25);
  }
  .answer-row input[type="text"]:disabled{
    background:#f5f5f5;
    color:#888;
  }
  .answer-row input.ok{
    border-color:var(--green);
    background:#e8f5ec;
    color:#2a6a3a;
  }
  .answer-row input.fail{
    border-color:var(--red);
    background:#fce8e8;
    color:#8a1a1a;
  }

  .shoot-btn{
    background:linear-gradient(135deg,#3a9a5a,#2a7a3a);
    color:#fff;
    border:none;
    padding:14px 36px;
    font-size:19px;
    font-weight:800;
    font-family:'Georgia',serif;
    border-radius:40px;
    cursor:pointer;
    transition:all .25s ease;
    box-shadow:0 6px 20px rgba(58,154,90,.5);
    letter-spacing:.5px;
  }
  .shoot-btn:hover:not(:disabled){
    transform:translateY(-3px);
    box-shadow:0 10px 28px rgba(58,154,90,.7);
  }
  .shoot-btn:disabled{
    opacity:.5;
    cursor:not-allowed;
  }

  .feedback{
    text-align:center;
    font-family:'Georgia',serif;
    font-size:18px;
    font-weight:800;
    min-height:28px;
    margin-top:14px;
    padding:6px 16px;
    border-radius:12px;
    opacity:0;
    transition:opacity .4s;
  }
  .feedback.show{opacity:1}
  .feedback.ok{color:#2a6a3a}
  .feedback.fail{color:#8a1a1a}

  /* ============ ФИНАЛЬНЫЙ ЭКРАН ============ */
  .final-screen{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(10,20,30,.92);
    backdrop-filter:blur(6px);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:20px;
  }
  .final-screen.show{display:flex;animation:fadeIn .6s ease}
  @keyframes fadeIn{from{opacity:0}to{opacity:1}}

  .final-card{
    background:linear-gradient(160deg,#fff,#eaf4fa);
    border:4px solid var(--gold);
    border-radius:28px;
    padding:36px 32px;
    text-align:center;
    max-width:480px;
    width:100%;
    box-shadow:0 20px 70px rgba(244,196,48,.4);
  }
  .final-card .trophy{
    font-size:80px;
    margin-bottom:12px;
    display:block;
    animation:bounceTrophy 2s ease-in-out infinite;
  }
  @keyframes bounceTrophy{
    0%,100%{transform:translateY(0) scale(1)}
    50%{transform:translateY(-12px) scale(1.05)}
  }
  .final-card h2{
    font-family:'Georgia',serif;
    font-size:28px;
    color:#1a3a6a;
    margin-bottom:14px;
  }
  .final-score{
    font-family:'Courier New',monospace;
    font-size:48px;
    font-weight:900;
    letter-spacing:4px;
    margin:14px 0 18px;
  }
  .final-score .goals{color:#3a9a5a}
  .final-score .sep{color:#1a3a6a;margin:0 12px}
  .final-score .misses{color:#e86060}
  .final-message{
    font-family:'Georgia',serif;
    font-size:17px;
    font-style:italic;
    color:var(--ink-soft);
    line-height:1.5;
    margin-bottom:22px;
    padding:14px 20px;
    background:rgba(74,123,168,.08);
    border-radius:14px;
  }
  .restart-btn{
    background:linear-gradient(135deg,#f4c430,#b8860b);
    color:#1a2a3a;
    border:none;
    padding:14px 36px;
    font-size:17px;
    font-weight:800;
    font-family:'Georgia',serif;
    border-radius:40px;
    cursor:pointer;
    transition:all .25s;
    box-shadow:0 6px 20px rgba(244,196,48,.5);
  }
  .restart-btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 28px rgba(244,196,48,.7);
  }

  /* ============ КОНФЕТТИ ============ */
  .celebration{position:fixed;inset:0;pointer-events:none;z-index:999;display:none}
  .celebration.show{display:block}
  .confetti{position:absolute;font-size:26px;animation:fallConf linear forwards}
  @keyframes fallConf{
    from{transform:translateY(-40px) rotate(0deg);opacity:1}
    to{transform:translateY(105vh) rotate(720deg);opacity:0}
  }

  @media (max-width:600px){
    .scoreboard{padding:10px 14px}
    .team{font-size:13px}
    .team .icon{font-size:20px}
    .score{font-size:26px}
    .task-equation{font-size:24px;padding:8px 18px}
    .shoot-btn{padding:12px 26px;font-size:16px}
    .final-card{padding:26px 20px}
    .final-card h2{font-size:22px}
  }
</style>
</head>
<body>

<div class="app">

  <!-- СЧЁТ -->
  <div class="scoreboard">
    <div class="team">
      <span class="icon">🧑‍🎓</span>
      <span>ТЫ</span>
    </div>
    <div class="score">
      <span class="goals" id="goalsScore">0</span>
      <span class="sep">:</span>
      <span class="misses" id="missesScore">0</span>
    </div>
    <div class="team">
      <span>ВРАТАРЬ</span>
      <span class="icon">🧤</span>
    </div>
    <div class="progress-balls" id="progressBalls"></div>
  </div>

  <!-- ФУТБОЛЬНОЕ ПОЛЕ -->
  <div class="field-wrapper">
    <svg id="field" viewBox="0 0 900 500" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#6ab8e8"/>
          <stop offset="100%" stop-color="#b0e0ff"/>
        </linearGradient>
        <linearGradient id="grassGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5aad4a"/>
          <stop offset="100%" stop-color="#2a7a1a"/>
        </linearGradient>
        <linearGradient id="netGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="rgba(255,255,255,0.35)"/>
          <stop offset="100%" stop-color="rgba(255,255,255,0.15)"/>
        </linearGradient>
        <radialGradient id="ballGrad" cx="0.35" cy="0.35" r="0.7">
          <stop offset="0%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#d0d0d0"/>
        </radialGradient>
      </defs>

      <!-- Небо -->
      <rect x="0" y="0" width="900" height="180" fill="url(#skyGrad)"/>

      <!-- Облака -->
      <g fill="rgba(255,255,255,0.75)">
        <ellipse cx="120" cy="60" rx="45" ry="18"/>
        <ellipse cx="150" cy="55" rx="35" ry="22"/>
        <ellipse cx="90" cy="55" rx="30" ry="15"/>
        <ellipse cx="400" cy="90" rx="38" ry="15"/>
        <ellipse cx="430" cy="85" rx="28" ry="18"/>
      </g>

      <!-- Трибуны (полоски) -->
      <g>
        <rect x="0" y="140" width="900" height="40" fill="#5a4a3a"/>
        <rect x="0" y="150" width="900" height="4" fill="#7a6a5a" opacity="0.5"/>
        <rect x="0" y="160" width="900" height="4" fill="#7a6a5a" opacity="0.5"/>
        <rect x="0" y="170" width="900" height="4" fill="#7a6a5a" opacity="0.5"/>
        <!-- Точки-болельщики -->
        <g fill="#e8b040" opacity="0.7">
          <circle cx="60" cy="148" r="3"/><circle cx="120" cy="152" r="3"/>
          <circle cx="180" cy="148" r="3"/><circle cx="240" cy="152" r="3"/>
          <circle cx="300" cy="148" r="3"/><circle cx="360" cy="152" r="3"/>
          <circle cx="420" cy="148" r="3"/><circle cx="480" cy="152" r="3"/>
          <circle cx="540" cy="148" r="3"/><circle cx="600" cy="152" r="3"/>
          <circle cx="660" cy="148" r="3"/><circle cx="720" cy="152" r="3"/>
          <circle cx="780" cy="148" r="3"/><circle cx="840" cy="152" r="3"/>
        </g>
      </g>

      <!-- Газон -->
      <rect x="0" y="180" width="900" height="320" fill="url(#grassGrad)"/>
      <!-- Полосы газона -->
      <g fill="rgba(255,255,255,0.06)">
        <rect x="0" y="180" width="900" height="40"/>
        <rect x="0" y="260" width="900" height="40"/>
        <rect x="0" y="340" width="900" height="40"/>
        <rect x="0" y="420" width="900" height="40"/>
      </g>

      <!-- Разметка -->
      <g stroke="rgba(255,255,255,0.7)" stroke-width="3" fill="none">
        <line x1="0" y1="330" x2="900" y2="330"/>
        <line x1="450" y1="180" x2="450" y2="500" opacity="0.4"/>
      </g>

      <!-- ВОРОТА -->
      <g id="goal">
        <!-- Сетка -->
        <rect x="650" y="120" width="200" height="220" fill="rgba(255,255,255,0.12)"/>
        <!-- Диагональные линии сетки -->
        <g stroke="rgba(255,255,255,0.55)" stroke-width="1" opacity="0.7">
          <!-- Вертикальные нити -->
          <line x1="670" y1="120" x2="670" y2="340"/>
          <line x1="690" y1="120" x2="690" y2="340"/>
          <line x1="710" y1="120" x2="710" y2="340"/>
          <line x1="730" y1="120" x2="730" y2="340"/>
          <line x1="750" y1="120" x2="750" y2="340"/>
          <line x1="770" y1="120" x2="770" y2="340"/>
          <line x1="790" y1="120" x2="790" y2="340"/>
          <line x1="810" y1="120" x2="810" y2="340"/>
          <line x1="830" y1="120" x2="830" y2="340"/>
          <!-- Горизонтальные нити -->
          <line x1="650" y1="140" x2="850" y2="140"/>
          <line x1="650" y1="160" x2="850" y2="160"/>
          <line x1="650" y1="180" x2="850" y2="180"/>
          <line x1="650" y1="200" x2="850" y2="200"/>
          <line x1="650" y1="220" x2="850" y2="220"/>
          <line x1="650" y1="240" x2="850" y2="240"/>
          <line x1="650" y1="260" x2="850" y2="260"/>
          <line x1="650" y1="280" x2="850" y2="280"/>
          <line x1="650" y1="300" x2="850" y2="300"/>
          <line x1="650" y1="320" x2="850" y2="320"/>
        </g>

        <!-- Штанги -->
        <line x1="650" y1="120" x2="650" y2="340" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
        <line x1="850" y1="120" x2="850" y2="340" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
        <line x1="650" y1="120" x2="850" y2="120" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>

        <!-- Тень у штанги -->
        <line x1="650" y1="340" x2="650" y2="355" stroke="rgba(0,0,0,0.25)" stroke-width="6"/>
        <line x1="850" y1="340" x2="850" y2="355" stroke="rgba(0,0,0,0.25)" stroke-width="6"/>
      </g>

      <!-- ВРАТАРЬ -->
      <g id="goalkeeper" transform="translate(750, 280)">
        <!-- Тень -->
        <ellipse cx="0" cy="62" rx="30" ry="8" fill="rgba(0,0,0,0.35)"/>
        <!-- Ноги -->
        <line x1="-10" y1="30" x2="-15" y2="58" stroke="#1a1a2a" stroke-width="9" stroke-linecap="round"/>
        <line x1="10" y1="30" x2="15" y2="58" stroke="#1a1a2a" stroke-width="9" stroke-linecap="round"/>
        <!-- Бутсы -->
        <ellipse cx="-18" cy="60" rx="9" ry="5" fill="#e83030"/>
        <ellipse cx="18" cy="60" rx="9" ry="5" fill="#e83030"/>
        <!-- Туловище (футболка) -->
        <rect x="-18" y="-10" width="36" height="42" rx="8" fill="#f4c430"/>
        <rect x="-18" y="-10" width="36" height="6" rx="3" fill="#e8a020"/>
        <!-- Номер на футболке -->
        <text x="0" y="14" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="900" fill="#1a1a2a">1</text>
        <!-- Руки -->
        <line id="armL" x1="-18" y1="0" x2="-42" y2="-12" stroke="#f4c430" stroke-width="7" stroke-linecap="round"/>
        <line id="armR" x1="18" y1="0" x2="42" y2="-12" stroke="#f4c430" stroke-width="7" stroke-linecap="round"/>
        <!-- Перчатки -->
        <circle id="gloveL" cx="-46" cy="-14" r="8" fill="#e83030"/>
        <circle id="gloveR" cx="46" cy="-14" r="8" fill="#e83030"/>
        <!-- Голова -->
        <circle cx="0" cy="-28" r="16" fill="#f0c896"/>
        <!-- Волосы -->
        <path d="M -16 -32 Q 0 -48 16 -32 Q 12 -38 0 -40 Q -12 -38 -16 -32 Z" fill="#3a2010"/>
        <!-- Глаза -->
        <circle cx="-5" cy="-28" r="2" fill="#1a1a2a"/>
        <circle cx="5" cy="-28" r="2" fill="#1a1a2a"/>
        <!-- Улыбка/сосредоточенность -->
        <line x1="-5" y1="-20" x2="5" y2="-20" stroke="#1a1a2a" stroke-width="1.5" stroke-linecap="round"/>
      </g>

      <!-- МЯЧ -->
      <g id="ball" transform="translate(120, 380)">
        <ellipse cx="0" cy="22" rx="16" ry="4" fill="rgba(0,0,0,0.3)"/>
        <circle cx="0" cy="0" r="18" fill="url(#ballGrad)" stroke="#1a1a2a" stroke-width="1.5"/>
        <!-- Пятиугольник по центру -->
        <polygon points="0,-7 6,-2 4,6 -4,6 -6,-2" fill="#1a1a2a"/>
        <line x1="0" y1="-7" x2="0" y2="-18" stroke="#1a1a2a" stroke-width="1.5"/>
        <line x1="6" y1="-2" x2="16" y2="-8" stroke="#1a1a2a" stroke-width="1.5"/>
        <line x1="-6" y1="-2" x2="-16" y2="-8" stroke="#1a1a2a" stroke-width="1.5"/>
        <line x1="4" y1="6" x2="12" y2="14" stroke="#1a1a2a" stroke-width="1.5"/>
        <line x1="-4" y1="6" x2="-12" y2="14" stroke="#1a1a2a" stroke-width="1.5"/>
      </g>

      <!-- Полёт мяча - вспышка -->
      <g id="flash" opacity="0">
        <circle cx="0" cy="0" r="60" fill="rgba(255,255,200,0.6)"/>
      </g>

      <!-- Текст "ГОЛ!" и "МИМО" -->
      <text id="goalText" x="450" y="250" text-anchor="middle"
            font-family="Georgia,serif" font-size="90" font-weight="900"
            fill="#f4c430" opacity="0"
            style="text-shadow:0 0 20px rgba(244,196,48,0.8)">
        ГОЛ!
      </text>
      <text id="missText" x="450" y="250" text-anchor="middle"
            font-family="Georgia,serif" font-size="80" font-weight="900"
            fill="#e86060" opacity="0">
        МИМО!
      </text>
      <text id="saveText" x="450" y="250" text-anchor="middle"
            font-family="Georgia,serif" font-size="70" font-weight="900"
            fill="#a8c8e0" opacity="0">
        ВРАТАРЬ ВЗЯЛ!
      </text>

    </svg>
  </div>

  <!-- ПАНЕЛЬ ЗАДАНИЯ -->
  <div class="task-panel">
    <span class="task-number" id="taskNumber">Удар 1 из 10</span>

    <div class="task-header">
      <span class="task-label">Реши уравнение:</span>
      <span class="task-equation" id="taskEquation">x + 8 = 15</span>
    </div>

    <div class="answer-row">
      <label>x =</label>
      <input type="text" id="answerInput" placeholder="?" autocomplete="off" inputmode="numeric">
      <button class="shoot-btn" id="shootBtn">⚽ Ударить!</button>
    </div>

    <div class="feedback" id="feedback"></div>
  </div>

</div>

<!-- ФИНАЛЬНЫЙ ЭКРАН -->
<div class="final-screen" id="finalScreen">
  <div class="final-card">
    <span class="trophy" id="trophyEmoji">🏆</span>
    <h2 id="finalTitle">Матч окончен!</h2>
    <div class="final-score">
      <span class="goals" id="finalGoals">0</span>
      <span class="sep">:</span>
      <span class="misses" id="finalMisses">0</span>
    </div>
    <div class="final-message" id="finalMessage"></div>
    <button class="restart-btn" onclick="restartGame()">🔄 Играть снова</button>
  </div>
</div>

<div class="celebration" id="celebration"></div>

<script>
// ================================================================
// УРАВНЕНИЯ (от простого к сложному)
// ================================================================
const EQUATIONS = [
  { eq: 'x + 8 = 15',          answer: 7,  show: 'x + 8 = 15' },
  { eq: 'x − 5 = 11',          answer: 16, show: 'x − 5 = 11' },
  { eq: '4x = 36',             answer: 9,  show: '4x = 36' },
  { eq: 'x : 7 = 6',           answer: 42, show: 'x : 7 = 6' },
  { eq: '2x + 9 = 23',         answer: 7,  show: '2x + 9 = 23' },
  { eq: '6x − 5 = 31',         answer: 6,  show: '6x − 5 = 31' },
  { eq: '3(x + 4) = 33',       answer: 7,  show: '3(x + 4) = 33' },
  { eq: '(x − 2) · 5 = 40',    answer: 10, show: '(x − 2)·5 = 40' },
  { eq: '5x + 4x = 72',        answer: 8,  show: '5x + 4x = 72' },
  { eq: '9x − 4x + 20 = 60',   answer: 8,  show: '9x − 4x + 20 = 60' }
];

// ================================================================
// СОСТОЯНИЕ
// ================================================================
let currentIndex = 0;
let goals = 0;
let misses = 0;
let wrongStreak = 0; // для чередования "мимо" и "вратарь взял"
let shotInProgress = false;
let gameOver = false;
const results = [];

// DOM
const ball = document.getElementById('ball');
const goalkeeper = document.getElementById('goalkeeper');
const taskNumberEl = document.getElementById('taskNumber');
const taskEquationEl = document.getElementById('taskEquation');
const answerInput = document.getElementById('answerInput');
const shootBtn = document.getElementById('shootBtn');
const feedbackEl = document.getElementById('feedback');
const goalsScoreEl = document.getElementById('goalsScore');
const missesScoreEl = document.getElementById('missesScore');
const progressBallsEl = document.getElementById('progressBalls');
const goalTextEl = document.getElementById('goalText');
const missTextEl = document.getElementById('missText');
const saveTextEl = document.getElementById('saveText');
const finalScreen = document.getElementById('finalScreen');
const finalTitleEl = document.getElementById('finalTitle');
const finalGoalsEl = document.getElementById('finalGoals');
const finalMissesEl = document.getElementById('finalMisses');
const finalMessageEl = document.getElementById('finalMessage');
const trophyEmojiEl = document.getElementById('trophyEmoji');

// Начальные координаты мяча
const BALL_START = { x: 120, y: 380 };
const GOAL_TARGET = { x: 730, y: 250 };   // верхний угол ворот
const SAVE_TARGET = { x: 750, y: 250 };    // в руки вратарю
const MISS_HIGH_TARGET = { x: 720, y: 40 }; // выше ворот
const MISS_SIDE_TARGET = { x: 950, y: 200 }; // правее ворот (мимо)

// ================================================================
// ОТРИСОВКА
// ================================================================
function renderTask() {
  const t = EQUATIONS[currentIndex];
  taskNumberEl.textContent = `Удар ${currentIndex + 1} из 10`;
  taskEquationEl.textContent = t.show;
  answerInput.value = '';
  answerInput.disabled = false;
  answerInput.classList.remove('ok', 'fail');
  answerInput.focus();
  shootBtn.disabled = false;
  feedbackEl.className = 'feedback';
  feedbackEl.textContent = '';

  // Сброс мяча и вратаря
  ball.setAttribute('transform', `translate(${BALL_START.x}, ${BALL_START.y})`);
  ball.style.transition = 'none';
  ball.style.opacity = '1';
  goalkeeper.style.transition = 'none';
  goalkeeper.setAttribute('transform', 'translate(750, 280)');
  goalTextEl.style.opacity = '0';
  missTextEl.style.opacity = '0';
  saveTextEl.style.opacity = '0';
  goalTextEl.style.transition = 'none';
  missTextEl.style.transition = 'none';
  saveTextEl.style.transition = 'none';
  goalTextEl.style.transform = 'scale(0.5)';
  missTextEl.style.transform = 'scale(0.5)';
  saveTextEl.style.transform = 'scale(0.5)';

  shotInProgress = false;
}

function renderProgressBalls() {
  let html = '';
  for (let i = 0; i < 10; i++) {
    const done = i < results.length;
    const isGoal = results[i];
    let emoji = '⚽';
    let cls = 'ball';
    if (done) {
      cls += ' done';
      emoji = isGoal ? '⚽' : '❌';
    }
    html += `<span class="${cls}">${emoji}</span>`;
  }
  progressBallsEl.innerHTML = html;
}

function updateScore() {
  goalsScoreEl.textContent = goals;
  missesScoreEl.textContent = misses;
}

// ================================================================
// ОТВЕТ
// ================================================================
function submitShot() {
  if (shotInProgress || gameOver) return;
  const val = answerInput.value.trim().replace(',', '.');
  if (val === '') return;

  const userAnswer = parseFloat(val);
  const correct = EQUATIONS[currentIndex].answer;
  const isCorrect = Math.abs(userAnswer - correct) < 0.001;

  shotInProgress = true;
  answerInput.disabled = true;
  shootBtn.disabled = true;

  if (isCorrect) {
    // ГОЛ!
    goals++;
    results.push(true);
    answerInput.classList.add('ok');
    feedbackEl.className = 'feedback show ok';
    feedbackEl.textContent = '⚽ Отличный удар! ГОЛ!';
    updateScore();
    renderProgressBalls();
    shootToGoal();
  } else {
    // Промах
    misses++;
    results.push(false);
    answerInput.classList.add('fail');
    feedbackEl.className = 'feedback show fail';
    feedbackEl.textContent = `❌ Мимо. Правильный ответ: x = ${correct}`;
    updateScore();
    renderProgressBalls();
    // Чередуем: сейв вратаря и промах
    if (wrongStreak % 2 === 0) {
      shootSave();
    } else {
      shootMiss();
    }
    wrongStreak++;
  }
}

// ================================================================
// АНИМАЦИЯ ПОЛЁТА МЯЧА
// ================================================================
function animateBall(startX, startY, endX, endY, curve, duration, onComplete) {
  const startTime = performance.now();

  function frame(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const ease = 1 - Math.pow(1 - t, 3); // easeOutCubic
    const x = startX + (endX - startX) * ease;
    const y = startY + (endY - startY) * ease + curve * Math.sin(Math.PI * ease);
    ball.setAttribute('transform', `translate(${x}, ${y})`);

    // Вращение мяча
    const rotation = ease * 720;
    ball.querySelector('circle').setAttribute('transform', `rotate(${rotation})`);

    if (t < 1) {
      requestAnimationFrame(frame);
    } else if (onComplete) {
      onComplete();
    }
  }
  requestAnimationFrame(frame);
}

function shootToGoal() {
  // Вратарь прыгает в неправильную сторону
  goalkeeper.style.transition = 'transform 0.7s cubic-bezier(0.34, 1.2, 0.5, 1)';
  goalkeeper.setAttribute('transform', 'translate(830, 320) rotate(-40)');

  // Мяч летит в левый верхний угол
  const duration = 900;
  animateBall(
    BALL_START.x, BALL_START.y,
    GOAL_TARGET.x, GOAL_TARGET.y,
    -80, // дуга вверх
    duration,
    () => {
      // Показать "ГОЛ!"
      goalTextEl.style.transition = 'all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1)';
      goalTextEl.style.opacity = '1';
      goalTextEl.style.transform = 'scale(1)';

      // Тряска сетки — лёгкое дрожание ворот
      shakeGoal();

      launchConfetti(25);

      setTimeout(() => {
        goalTextEl.style.opacity = '0';
        setTimeout(nextTask, 600);
      }, 1200);
    }
  );
}

function shootSave() {
  // Вратарь ловит мяч
  goalkeeper.style.transition = 'transform 0.5s cubic-bezier(0.34, 1.2, 0.5, 1)';
  goalkeeper.setAttribute('transform', 'translate(700, 260)');

  const duration = 800;
  animateBall(
    BALL_START.x, BALL_START.y,
    SAVE_TARGET.x, SAVE_TARGET.y,
    -60,
    duration,
    () => {
      saveTextEl.style.transition = 'all 0.4s ease';
      saveTextEl.style.opacity = '1';
      saveTextEl.style.transform = 'scale(1)';

      setTimeout(() => {
        saveTextEl.style.opacity = '0';
        setTimeout(nextTask, 600);
      }, 1200);
    }
  );
}

function shootMiss() {
  // Вратарь стоит, а мяч летит выше ворот
  const duration = 850;
  animateBall(
    BALL_START.x, BALL_START.y,
    MISS_HIGH_TARGET.x, MISS_HIGH_TARGET.y,
    -100,
    duration,
    () => {
      missTextEl.style.transition = 'all 0.4s ease';
      missTextEl.style.opacity = '1';
      missTextEl.style.transform = 'scale(1)';

      setTimeout(() => {
        missTextEl.style.opacity = '0';
        setTimeout(nextTask, 600);
      }, 1200);
    }
  );
}

function shakeGoal() {
  // Небольшая вибрация сетки
  const goal = document.getElementById('goal');
  let count = 0;
  const id = setInterval(() => {
    goal.setAttribute('transform', `translate(${Math.random() * 6 - 3}, ${Math.random() * 4 - 2})`);
    count++;
    if (count > 8) {
      clearInterval(id);
      goal.setAttribute('transform', 'translate(0,0)');
    }
  }, 40);
}

// ================================================================
// СЛЕДУЮЩЕЕ ЗАДАНИЕ
// ================================================================
function nextTask() {
  currentIndex++;
  if (currentIndex >= EQUATIONS.length) {
    showFinal();
    return;
  }
  renderTask();
}

// ================================================================
// ФИНАЛ
// ================================================================
function showFinal() {
  gameOver = true;
  finalGoalsEl.textContent = goals;
  finalMissesEl.textContent = misses;

  let title, message, trophy;
  if (goals === 10) {
    title = '⚽ РАЗГРОМНАЯ ПОБЕДА!';
    message = 'Все 10 ударов — в цель! Ты настоящий мастер уравнений и футбола! 🏆';
    trophy = '🏆';
  } else if (goals >= 8) {
    title = '🎉 Уверенная победа!';
    message = 'Отличная игра! Почти все мячи в воротах. Ещё немного тренировки — и будет идеальный счёт!';
    trophy = '🥇';
  } else if (goals >= 6) {
    title = '👏 Хороший матч!';
    message = 'Ты справился с большей частью ударов. Повтори правила решения уравнений — и в следующий раз будет ещё лучше!';
    trophy = '🥈';
  } else if (goals >= 4) {
    title = '⚽ Боевая ничья';
    message = 'Половина мячей в воротах. Тренируйся ещё — уравнения требуют внимания!';
    trophy = '🥉';
  } else {
    title = '🧤 Вратарь победил';
    message = 'Сегодня не твой день. Повтори, как решаются уравнения — и обязательно отыграйся!';
    trophy = '⚽';
  }

  trophyEmojiEl.textContent = trophy;
  finalTitleEl.textContent = title;
  finalMessageEl.textContent = message;

  finalScreen.classList.add('show');

  if (goals >= 8) {
    setTimeout(() => launchConfetti(70), 400);
  }
}

// ================================================================
// КОНФЕТТИ
// ================================================================
function launchConfetti(count) {
  count = count || 20;
  const celebration = document.getElementById('celebration');
  celebration.classList.add('show');
  const emojis = ['⚽', '🎉', '✨', '🌟', '💫', '🎊', '🏆', '🥇'];
  for (let i = 0; i < count; i++) {
    const c = document.createElement('div');
    c.className = 'confetti';
    c.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    c.style.left = Math.random() * 100 + 'vw';
    c.style.fontSize = (18 + Math.random() * 22) + 'px';
    const dur = 2.5 + Math.random() * 1.8;
    c.style.animationDuration = dur + 's';
    c.style.animationDelay = (Math.random() * 0.5) + 's';
    celebration.appendChild(c);
    setTimeout(() => c.remove(), (dur + 1) * 1000);
  }
  setTimeout(() => celebration.classList.remove('show'), 4000);
}

// ================================================================
// ПЕРЕЗАПУСК
// ================================================================
function restartGame() {
  currentIndex = 0;
  goals = 0;
  misses = 0;
  wrongStreak = 0;
  shotInProgress = false;
  gameOver = false;
  results.length = 0;

  finalScreen.classList.remove('show');
  updateScore();
  renderProgressBalls();
  renderTask();
}

// ================================================================
// ОБРАБОТЧИКИ
// ================================================================
shootBtn.addEventListener('click', submitShot);
answerInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    submitShot();
  }
});

// ================================================================
// СТАРТ
// ================================================================
updateScore();
renderProgressBalls();
renderTask();
</script>

</body>
</html>
